<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestalt Super">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Gestalt Super</title>
<style>
:root{--blue:#0A84FF;--card:#1C1C1E;--sep:#2C2C2E;--mute:#8E8E93;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font-family:inherit}

#home{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;padding-top:env(safe-area-inset-top,0px)}
.top{padding:56px 20px 6px;animation:rise .6s var(--ease) both}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
.badge{display:inline-block;margin-top:8px;font-size:12px;color:var(--blue);background:rgba(10,132,255,.15);padding:5px 10px;border-radius:999px}
.scroll{flex:1;overflow-y:auto;padding:0 16px 130px;scroll-behavior:smooth}
.view{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:20px 4px 8px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--sep);transition:background .25s}
.row:last-child{border-bottom:none}
.row:active{background:#2a2a2d}
.row .txt{flex:1}
.row .txt b{display:block;font-size:16px;font-weight:400}
.row .txt span{font-size:13px;color:var(--mute)}
.chev{color:var(--blue);font-size:20px}

/* LIQUID GLASS SWITCH */
.switch{width:56px;height:34px;border-radius:999px;position:relative;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.12);
  transition:background .45s var(--ease),box-shadow .45s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#fff 0%,rgba(255,255,255,.85) 30%,rgba(210,220,235,.55) 75%,rgba(160,175,200,.6) 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.9);
  transition:transform .5s var(--ease),width .3s var(--ease)}
.switch:active::after{width:34px}
.switch.on{background:linear-gradient(180deg,rgba(10,132,255,.95),rgba(10,100,230,.85));border-color:rgba(160,210,255,.5);box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 14px rgba(10,132,255,.45)}
.switch.on::after{transform:translateX(22px)}
.switch.on:active::after{transform:translateX(16px)}

/* LIQUID GLASS BAR */
.tabs{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(260px,calc(100% - 28px));display:flex;padding:5px;border-radius:999px;z-index:6;
  background:linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.12) 100%);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -2px 6px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.55);
  backdrop-filter:blur(14px) saturate(200%) brightness(1.1);-webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.1)}
.tab{flex:1;border:none;background:none;color:rgba(255,255,255,.65);font-size:12px;font-weight:500;padding:9px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .35s var(--ease)}
.tab.on{color:#fff}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;z-index:0;
  background:linear-gradient(170deg,rgba(255,255,255,.35),rgba(255,255,255,.1));
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.35);
  transition:transform .55s var(--ease)}

/* WALLPAPERS */
.upbtn{display:block;text-align:center;padding:16px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease)}
.upbtn:active{transform:scale(.98)}
.upbtn input{display:none}
.wall{margin-top:12px;height:260px;border-radius:14px;background:#111 center/cover no-repeat;display:none;align-items:flex-end;justify-content:center;padding:12px;color:#fff;overflow:hidden;animation:rise .5s var(--ease) both}
.wall.on{display:flex}
.wall .pill2{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;font-size:13px}
.apply{margin-top:12px;width:100%;padding:16px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:none}
.apply.on{display:block;animation:rise .5s var(--ease) both}

.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:rgba(44,44,46,.85);backdrop-filter:blur(12px);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.35s var(--ease);pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<section id="home">
  <div class="top">
    <h1>Gestalt Super</h1>
    <span class="badge">Supported on iOS 26.0–27.3</span>
  </div>
  <div class="scroll" id="scroll"></div>
  <nav class="tabs" id="tabs">
    <span class="pill" id="pill"></span>
    <button class="tab on" data-view="features">Features</button>
    <button class="tab" data-view="posters">Wallpapers</button>
  </nav>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let tt;
const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600); };

const features = [
  ['aod','Always-On Display','Keep your screen dimmed and visible'],
  ['island','Dynamic Island','Live activities at the top of the screen'],
  ['camera','Camera Control','Quick access to the camera'],
  ['action','Action Button','Assign one button to any action'],
  ['sync','iCloud Sync','Keep settings on all devices']
];
const st = { on:{} };

function build(view) {
  const s = $('scroll');
  s.innerHTML = '';
  const v = document.createElement('div');
  v.className = 'view';
  s.appendChild(v);

  if (view === 'features') {
    v.innerHTML = '<h2>Features</h2>';
    const g = document.createElement('div'); g.className = 'group';
    features.forEach(([id,name,desc]) => {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `<div class="txt"><b>${name}</b><span>${desc}</span></div><div class="switch"></div>`;
      const sw = r.querySelector('.switch');
      sw.classList.toggle('on', !!st.on[id]);
      sw.onclick = () => { st.on[id] = !st.on[id]; sw.classList.toggle('on', st.on[id]); toast(name + (st.on[id] ? ' on' : ' off')); };
      g.appendChild(r);
    });
    v.appendChild(g);
    const f = document.createElement('div'); f.className = 'group'; f.style.marginTop = '16px';
    f.innerHTML = `<div class="row" id="exp" style="cursor:pointer"><div class="txt"><b>Export setup file</b><span>Gestalt Setup.gsetup</span></div><span class="chev">›</span></div>
      <div class="row" id="imp" style="cursor:pointer"><div class="txt"><b>Import setup file</b><span>Choose a .gsetup file</span></div><span class="chev">›</span></div>`;
    v.appendChild(f);
    $('exp').onclick = () => toast('Setup file saved');
    $('imp').onclick = () => toast('Setup file imported');
  }

  if (view === 'posters') {
    v.innerHTML = '<h2>Wallpapers</h2>';
    const label = document.createElement('label'); label.className = 'upbtn';
    label.innerHTML = 'Upload Wallpaper<input type="file" accept="image/*" id="file">';
    v.appendChild(label);
    const wall = document.createElement('div'); wall.className = 'wall'; wall.id = 'wall';
    wall.innerHTML = '<span class="pill2">Lock Screen preview</span>';
    v.appendChild(wall);
    const apply = document.createElement('button'); apply.className = 'apply'; apply.id = 'apply';
    apply.textContent = 'Apply Wallpaper';
    v.appendChild(apply);
    $('file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      wall.style.backgroundImage = `url(${URL.createObjectURL(f)})`;
      wall.classList.remove('on'); void wall.offsetWidth; wall.classList.add('on');
      apply.classList.add('on');
    };
    apply.onclick = () => toast('Wallpaper applied');
  }
}

/* sliding glass pill between tabs */
const tabs = [...document.querySelectorAll('.tab')];
function moveTo(btn) {
  const i = tabs.indexOf(btn);
  $('pill').style.transform = `translateX(${i * 100}%)`;
  tabs.forEach(x => x.classList.toggle('on', x===btn));
}
tabs.forEach(b => b.onclick = () => { moveTo(b); build(b.dataset.view); });

build('features');
</script>
</body>
</html>
